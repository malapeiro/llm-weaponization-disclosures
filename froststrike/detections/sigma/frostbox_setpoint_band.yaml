title: Refrigeration Controller Setpoint Outside Guarded Band
id: 7d1c9a52-4f0e-4a71-9c88-2b61d0e3fa01
status: experimental
description: >
  Detects setpoint changes on a refrigeration supervisor that fall outside the
  allowed band per case type (freezer [-30,-15] C, chilled [0,+6] C). Mirrors the
  2026 supermarket refrigeration sabotage campaign, where setpoints were pushed
  to +50 C on internet-exposed supervisory web interfaces.
references:
  - https://cert.cyber.gouv.fr/alerte/CERTFR-2026-ALE-012/
author: Sergio Azevedo
date: 2026/11/05
logsource:
  product: frostbox
  service: audit
detection:
  selection_event:
    event: 'CFG_SETPOINT'
  freezer_too_high:
    case|startswith: 'FZ-'
    new|gt: -15
  freezer_too_low:
    case|startswith: 'FZ-'
    new|lt: -30
  chilled_too_high:
    case|startswith: 'CH-'
    new|gt: 6
  chilled_too_low:
    case|startswith: 'CH-'
    new|lt: 0
  condition: selection_event and 1 of [freezer_too_high, freezer_too_low, chilled_too_high, chilled_too_low]
falsepositives:
  - Seasonal setpoint re-configuration by service technicians (should occur only
    inside the maintenance window and from the maintenance network)
level: critical
tags:
  - attack.impact
  - attack.t0879   # ICS ATT&CK: Damage to Property
